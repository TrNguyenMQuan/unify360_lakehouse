checks for app_events:
  - row_count >= 9000

  - missing_count(event_id) = 0
  - missing_count(anonymous_id) = 0
  - missing_count(event_type) = 0

  - pct_duplicate_event_id:
      warn: when > 2
      fail: when > 20
      pct_duplicate_event_id query: |
        select round(100.0 * (count(*) - count(distinct event_id))
              / nullif(count(*), 0), 2)
        from app_events

  - missing_percent(user_id) between 15 and 35  # because without login user dont have id

  - schema:
      fail:
        when required column missing:
          [event_id, event_type, anonymous_id, user_id, "timestamp"]

  # - hours_since_ingest: it not prove pipeline is run properly
  #     warn: when > 30
  #     fail: when > 48
  #     hours_since_ingest query: |
  #       SELECT date_diff('hour',
  #                         max(from_iso8601_timestamp(_ingested_at)),
  #                         current_timestamp)
  #       FROM iceberg.bronze.app_events

  - hours_since_last_event:
      warn: when not between 0 and 26
      fail: when not between 0 and 50
      hours_since_last_event query: |
        SELECT date_diff('hour',
                          max(cast("timestamp" as timestamp(6))),
                          current_timestamp)
        FROM app_events

