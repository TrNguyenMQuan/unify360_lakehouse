# use for check properly of mectric under aspect of bussniness

checks for dim_customer:
  - customers_lost_from_silver = 0:
      customers_lost_from_silver query: |
        select (select count(distinct customer_key) from silver.identity_map)
            -  (select count(*)                     from gold.dim_customer)

  - failed rows:
      name: n_source_records must equal total of source flags
      fail condition: n_source_records <> (in_crm + in_stripe + in_app)

  - failed rows:
      name: PII guard - email must stay masked in gold
      fail condition: email_masked not like '_***@%'

checks for fact_subscriptions:
  - scd2_history_versions:
      warn: when < 1
      scd2_history_versions query: |
        select count(*) - count_if(is_current) from gold.fact_subscriptions

  - subscriptions_lost_in_scd2 = 0:
      subscriptions_lost_in_scd2 query: |
        select (select count(*)             from silver.subscriptions)
            -  (select count_if(is_current) from gold.fact_subscriptions)

checks for mart_mrr:
  - row_count = 4

  - total_mrr:  # according basline to create this testcase just in case plan_pricing change suddendly
      warn: when not between 30000 and 50000
      fail: when not between 20000 and 80000
      total_mrr query: |
        select sum(mrr) from gold.mart_mrr

  - arpu_per_customer: # arpu is averange revenue per user (included free) = mrr / amout user payment
      warn: when not between 55 and 90
      arpu_per_customer query: |
        select round(1.0 * (select sum(mrr) from gold.mart_mrr)
              / nullif((select count(*) from gold.dim_customer), 0), 2)

  - top_plan_revenue_share: # metric for bussiness
      warn: when > 85
      top_plan_revenue_share query: |
        select round(100.0 * max(mrr) / nullif(sum(mrr), 0), 2)
        from gold.mart_mrr

checks for mart_funnel:
  - row_count = 1

  - failed rows:
      name: conversion rates must stay in a plausible band
      fail condition: lead_to_signup_rate not between 0.6 and 0.95
                   or signup_to_paid_rate not between 0.4 and 0.85

checks for recon_billing_vs_app:
  - row_count = 4

  # app_only = user use service without payment
  - pct_revenue_leakage:
      warn: when > 20
      fail: when > 30
      pct_revenue_leakage query: |
        select round(100.0 * sum(if(recon_status like '3_app_only%', n_customers, 0))
              / nullif(sum(n_customers), 0), 2)
        from gold.recon_billing_vs_app